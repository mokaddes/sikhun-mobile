name: Build & Release Sikhun Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          java -version
          flutter --version

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release -v

      - name: Rename APK for Release
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sikhun-app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sikhun-app-release
          path: build/app/outputs/flutter-apk/sikhun-app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release & Attach APK
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Sikhun Mobile Release v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## শিখুন (Sikhun) মোবাইল অ্যাপ
            স্বয়ংক্রিয়ভাবে তৈরি হওয়া লেটেস্ট অ্যান্ড্রয়েড APK ফাইল।
            
            ### ডাউনলোড ও ইনস্টল:
            নিচের Assets সেকশন থেকে `sikhun-app-release.apk` ফাইলটি সরাসরি ডাউনলোড করে আপনার অ্যান্ড্রয়েড স্মার্টফোনে ইনস্টল করুন।
          files: build/app/outputs/flutter-apk/sikhun-app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
